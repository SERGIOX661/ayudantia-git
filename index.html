<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        .btn{
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s;
        }

        .btn:hover{
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

    <h1>Bienvenido a mi página</h1>
    <p>Esta es una página de ejemplo.</p>

    <!-- Botón 1 -->
    <button class="btn" onclick="saludar()">
        Saludar
    </button>

    <!-- Botón 2 -->
    <button class="btn" onclick="mostrarHora()">
        Ver hora
    </button>

    <script>
        function saludar(){
            alert("¡Hola! Bienvenido a la página.");
        }

        function mostrarHora(){
            const ahora = new Date();
            alert("La hora actual es: " + ahora.toLocaleTimeString());
        }
    </script>

</body>
</html>
